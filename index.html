<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PriceCheck MVP - Security Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Render Live Backend Base URL
        const API_BASE_URL = "https://price-check-webhook.onrender.com";

        function App() {
            const [activeTab, setActiveTab] = useState('manager');
            const [managerStep, setManagerStep] = useState(1);
            const [email, setEmail] = useState('');
            const [otp, setOtp] = useState('');
            const [newPin, setNewPin] = useState('');
            const [confirmPin, setConfirmPin] = useState('');
            const [loading, setLoading] = useState(false);
            const [message, setMessage] = useState(null);

            useEffect(() => {
                lucide.createIcons();
            }, [managerStep, activeTab]);

            // STEP 1: Request OTP via Express + Mailgun API
            const handleRequestOtp = async (e) => {
                e.preventDefault();
                setLoading(true);
                setMessage(null);

                try {
                    const response = await fetch(`${API_BASE_URL}/api/auth/pin-reset-request`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: email.toLowerCase().trim() })
                    });
                    const data = await response.json();

                    if (!response.ok) throw new Error(data.message || 'Failed to request OTP');

                    setManagerStep(2);
                    setMessage({ type: 'success', text: 'Verification OTP sent to your email via Mailgun!' });
                } catch (err) {
                    setMessage({ type: 'error', text: err.message });
                } finally {
                    setLoading(false);
                }
            };

            // STEP 2: Verify OTP
            const handleVerifyOtp = async (e) => {
                e.preventDefault();
                setLoading(true);
                setMessage(null);

                try {
                    const response = await fetch(`${API_BASE_URL}/api/auth/pin-reset-verify`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: email.toLowerCase().trim(), otp: otp.trim() })
                    });
                    const data = await response.json();

                    if (!response.ok) throw new Error(data.message || 'Invalid or expired OTP');

                    setManagerStep(3);
                    setMessage({ type: 'success', text: 'OTP verified. Please enter your new 4-digit PIN.' });
                } catch (err) {
                    setMessage({ type: 'error', text: err.message });
                } finally {
                    setLoading(false);
                }
            };

            // STEP 3: Update Security PIN in Airtable
            const handleUpdatePin = async (e) => {
                e.preventDefault();
                if (newPin !== confirmPin || newPin.length !== 4) {
                    setMessage({ type: 'error', text: 'PINs must match and be exactly 4 digits.' });
                    return;
                }
                setLoading(true);
                setMessage(null);

                try {
                    const response = await fetch(`${API_BASE_URL}/api/auth/pin-reset-update`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            email: email.toLowerCase().trim(), 
                            otp: otp.trim(), 
                            newPin: newPin.trim() 
                        })
                    });
                    const data = await response.json();

                    if (!response.ok) throw new Error(data.message || 'Failed to update PIN');

                    setManagerStep(4);
                    setMessage({ type: 'success', text: 'PIN successfully updated in Airtable!' });
                } catch (err) {
                    setMessage({ type: 'error', text: err.message });
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="max-w-4xl mx-auto p-6">
                    <header className="mb-8 p-6 bg-slate-800 rounded-xl border border-slate-700 flex justify-between items-center">
                        <h1 className="text-xl font-bold text-white">PriceCheck PIN Recovery Console</h1>
                        <span className="text-xs bg-emerald-500/10 text-emerald-400 px-3 py-1 rounded-full border border-emerald-500/30">
                            Live API Linked
                        </span>
                    </header>

                    {message && (
                        <div className={`mb-6 p-4 rounded-xl border ${message.type === 'success' ? 'bg-emerald-950/40 border-emerald-500/30 text-emerald-300' : 'bg-rose-950/40 border-rose-500/30 text-rose-300'}`}>
                            {message.text}
                        </div>
                    )}

                    <div className="bg-slate-800 border border-slate-700 rounded-xl p-8 shadow-xl">
                        {managerStep === 1 && (
                            <form onSubmit={handleRequestOtp} className="space-y-4">
                                <label className="block text-sm font-medium text-slate-300">Authorized Manager Email</label>
                                <input 
                                    type="email" 
                                    required 
                                    value={email} 
                                    onChange={(e) => setEmail(e.target.value)} 
                                    placeholder="fredrick.sakala@outlook.com" 
                                    className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500" 
                                />
                                <button type="submit" disabled={loading} className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-3 rounded-xl">
                                    {loading ? 'Sending OTP via Mailgun...' : 'Send Verification OTP'}
                                </button>
                            </form>
                        )}

                        {managerStep === 2 && (
                            <form onSubmit={handleVerifyOtp} className="space-y-4">
                                <label className="block text-sm font-medium text-slate-300">Enter 6-Digit OTP</label>
                                <input 
                                    type="text" 
                                    maxLength="6" 
                                    required 
                                    value={otp} 
                                    onChange={(e) => setOtp(e.target.value)} 
                                    className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-center text-2xl tracking-widest text-white focus:outline-none focus:border-emerald-500" 
                                />
                                <button type="submit" disabled={loading} className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-3 rounded-xl">
                                    {loading ? 'Verifying...' : 'Verify OTP Code'}
                                </button>
                            </form>
                        )}

                        {managerStep === 3 && (
                            <form onSubmit={handleUpdatePin} className="space-y-4">
                                <label className="block text-sm font-medium text-slate-300">New 4-Digit Security PIN</label>
                                <input 
                                    type="password" 
                                    maxLength="4" 
                                    required 
                                    value={newPin} 
                                    onChange={(e) => setNewPin(e.target.value)} 
                                    className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-center text-xl text-white focus:outline-none focus:border-emerald-500" 
                                />
                                <label className="block text-sm font-medium text-slate-300">Confirm PIN</label>
                                <input 
                                    type="password" 
                                    maxLength="4" 
                                    required 
                                    value={confirmPin} 
                                    onChange={(e) => setConfirmPin(e.target.value)} 
                                    className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-center text-xl text-white focus:outline-none focus:border-emerald-500" 
                                />
                                <button type="submit" disabled={loading} className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-3 rounded-xl">
                                    {loading ? 'Updating Airtable...' : 'Set New Security PIN'}
                                </button>
                            </form>
                        )}

                        {managerStep === 4 && (
                            <div className="text-center py-6 space-y-4">
                                <h3 className="text-xl font-bold text-emerald-400">PIN Successfully Updated!</h3>
                                <p className="text-sm text-slate-400">Your new PIN is now active for price updates.</p>
                                <button onClick={() => setManagerStep(1)} className="bg-slate-700 text-white px-6 py-2.5 rounded-xl text-sm">Reset Another</button>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
