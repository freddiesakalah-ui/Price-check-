<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PriceCheck Manager Portal</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #10b981;
      --accent-hover: #059669;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --input-bg: #0f172a;
      --border-color: #334155;
      --error-color: #ef4444;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 550px;
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border-color);
    }

    /* Tab Navigation */
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
    }

    .tab-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      padding: 6px 12px;
      border-radius: 6px;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background-color: var(--accent-color);
      color: #fff;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    h1 {
      font-size: 1.5rem;
      margin-top: 0;
      margin-bottom: 8px;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 0;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 6px;
      color: var(--text-muted);
    }

    input[type="email"],
    input[type="password"],
    input[type="number"] {
      width: 100%;
      padding: 10px 12px;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 0.95rem;
      box-sizing: border-box;
    }

    input:focus {
      outline: none;
      border-color: var(--accent-color);
    }

    .auth-row {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 12px;
    }

    hr {
      border: 0;
      height: 1px;
      background: var(--border-color);
      margin: 24px 0;
    }

    .product-list-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .product-row {
      display: grid;
      grid-template-columns: 1fr 120px;
      gap: 12px;
      align-items: center;
      margin-bottom: 12px;
    }

    .product-name {
      font-weight: 500;
      font-size: 0.95rem;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background-color: var(--accent-color);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 16px;
    }

    .btn-submit:hover {
      background-color: var(--accent-hover);
    }

    .btn-submit:disabled {
      background-color: var(--border-color);
      cursor: not-allowed;
    }

    .statusMessage {
      margin-top: 16px;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.9rem;
      display: none;
      text-align: center;
    }

    .status-success {
      background-color: rgba(16, 185, 129, 0.15);
      color: var(--accent-color);
      border: 1px solid var(--accent-color);
    }

    .status-error {
      background-color: rgba(239, 68, 68, 0.15);
      color: var(--error-color);
      border: 1px solid var(--error-color);
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Navigation Tabs -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('bulkTab', this)">Bulk Prices</button>
      <button class="tab-btn" onclick="switchTab('otpTab', this)">PIN Recovery / OTP</button>
    </div>

    <!-- TAB 1: BULK PRICE UPDATES -->
    <div id="bulkTab" class="tab-content active">
      <h1>PriceCheck Portal</h1>
      <p class="subtitle">Bulk Store Price Management</p>

      <div class="auth-row">
        <div class="form-group">
          <label for="email">Manager Email</label>
          <input type="email" id="email" placeholder="fredrick.sakala@outlook.com" required />
        </div>
        <div class="form-group">
          <label for="pin">Security PIN</label>
          <input type="password" id="pin" placeholder="••••" maxlength="6" required />
        </div>
      </div>

      <hr />

      <div class="product-list-header">
        <span>Product Catalog Item</span>
        <span>New Price ($)</span>
      </div>

      <div class="product-row">
        <span class="product-name">Bread</span>
        <input type="number" class="price-input" data-product="Bread" step="0.01" placeholder="0.00" />
      </div>

      <div class="product-row">
        <span class="product-name">Sugar</span>
        <input type="number" class="price-input" data-product="Sugar" step="0.01" placeholder="0.00" />
      </div>

      <div class="product-row">
        <span class="product-name">Mazoe</span>
        <input type="number" class="price-input" data-product="Mazoe" step="0.01" placeholder="0.00" />
      </div>

      <button type="button" class="btn-submit" id="submitBtn">Submit Price Updates</button>
      <div id="bulkStatus" class="statusMessage"></div>
    </div>

   <!-- TAB 2: PIN RECOVERY / OTP CONSOLE -->
    <div id="otpTab" class="tab-content">
      <h1>PIN Recovery Console</h1>
      <p class="subtitle">Securely Reset Your Manager PIN via Email OTP</p>

      <!-- Step 1: Request OTP Form -->
      <div id="step1Container">
        <div class="form-group">
          <label for="otpEmail">Authorized Manager Email</label>
          <input type="email" id="otpEmail" placeholder="fredrick.sakala@outlook.com" required />
        </div>
        <button type="button" class="btn-submit" id="requestOtpBtn">Send Verification OTP</button>
      </div>

      <!-- Step 2: Verify OTP & Set New PIN (Initially Hidden) -->
      <div id="step2Container" style="display: none; margin-top: 16px;">
        <div class="form-group">
          <label for="receivedOtp">Enter 6-Digit OTP Code</label>
          <input type="text" id="receivedOtp" placeholder="123456" maxlength="6" />
        </div>
        <div class="form-group">
          <label for="newPin">Enter New Security PIN</label>
          <input type="password" id="newPin" placeholder="••••" maxlength="6" />
        </div>
        <button type="button" class="btn-submit" id="resetPinBtn">Verify & Reset PIN</button>
      </div>

      <div id="otpStatus" class="statusMessage"></div>
    </div>

  <script>
    // Tab Switcher Logic
    function switchTab(tabId, btnElement) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      
      document.getElementById(tabId).classList.add('active');
      btnElement.classList.add('active');
    }

    // Bulk Price Submission Logic
    const submitBtn = document.getElementById('submitBtn');
    const bulkStatus = document.getElementById('bulkStatus');

    submitBtn.addEventListener('click', async () => {
      const email = document.getElementById('email').value.trim();
      const pin = document.getElementById('pin').value.trim();

      const priceInputs = document.querySelectorAll('.price-input');
      const updates = [];

      priceInputs.forEach(input => {
        const value = input.value.trim();
        if (value !== '') {
          updates.push({
            productId: input.getAttribute('data-product'),
            newPrice: parseFloat(value)
          });
        }
      });

      if (!email || !pin) {
        showStatus(bulkStatus, 'Please enter both your Email and PIN.', 'error');
        return;
      }

      if (updates.length === 0) {
        showStatus(bulkStatus, 'Please enter at least one new price to update.', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = 'Submitting Updates...';
      bulkStatus.style.display = 'none';

      try {
        const response = await fetch('https://price-check-webhook.onrender.com/api/prices/bulk-submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, pin, updates })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          showStatus(bulkStatus, `Success! Updated ${data.count} price item(s) in Airtable.`, 'success');
          priceInputs.forEach(input => input.value = '');
        } else {
          showStatus(bulkStatus, data.message || 'Failed to submit updates.', 'error');
        }
      } catch (err) {
        showStatus(bulkStatus, 'Network error connecting to backend service.', 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Submit Price Updates';
      }
    });

   const requestOtpBtn = document.getElementById('requestOtpBtn');
    const resetPinBtn = document.getElementById('resetPinBtn');
    const otpStatus = document.getElementById('otpStatus');
    
    let targetEmail = '';

    // Step 1: Request OTP
    requestOtpBtn.addEventListener('click', async () => {
      targetEmail = document.getElementById('otpEmail').value.trim();
      if (!targetEmail) {
        showStatus(otpStatus, 'Please enter your manager email.', 'error');
        return;
      }

      requestOtpBtn.disabled = true;
      requestOtpBtn.innerText = 'Sending OTP...';

      try {
        const res = await fetch('https://price-check-webhook.onrender.com/api/auth/request-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: targetEmail })
        });
        const data = await res.json();

        if (res.ok && data.success) {
          showStatus(otpStatus, 'OTP sent! Check your inbox for the code.', 'success');
          document.getElementById('step1Container').style.display = 'none';
          document.getElementById('step2Container').style.display = 'block';
        } else {
          showStatus(otpStatus, data.message || 'Failed to send OTP.', 'error');
        }
      } catch (err) {
        showStatus(otpStatus, 'Network error connecting to backend.', 'error');
      } finally {
        requestOtpBtn.disabled = false;
        requestOtpBtn.innerText = 'Send Verification OTP';
      }
    });

    // Step 2: Verify OTP and Reset PIN
    resetPinBtn.addEventListener('click', async () => {
      const otp = document.getElementById('receivedOtp').value.trim();
      const newPin = document.getElementById('newPin').value.trim();

      if (!otp || !newPin) {
        showStatus(otpStatus, 'Please enter both the OTP and your new PIN.', 'error');
        return;
      }

      resetPinBtn.disabled = true;
      resetPinBtn.innerText = 'Resetting PIN...';

      try {
        const res = await fetch('https://price-check-webhook.onrender.com/api/auth/reset-pin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: targetEmail, otp, newPin })
        });
        const data = await res.json();

        if (res.ok && data.success) {
          showStatus(otpStatus, 'Success! Your PIN has been reset. You can now log in.', 'success');
          setTimeout(() => {
            location.reload(); // Refresh page back to login/bulk prices tab
          }, 3000);
        } else {
          showStatus(otpStatus, data.message || 'Invalid or expired OTP.', 'error');
        }
      } catch (err) {
        showStatus(otpStatus, 'Network error connecting to backend.', 'error');
      } finally {
        resetPinBtn.disabled = false;
        resetPinBtn.innerText = 'Verify & Reset PIN';
      }
    });
    function showStatus(element, msg, type) {
      element.innerText = msg;
      element.className = 'statusMessage ' + (type === 'success' ? 'status-success' : 'status-error');
      element.style.display = 'block';
    }
  </script>


 <!-- Admin Shop Creation Panel -->
<div class="admin-panel" style="max-width: 550px; margin: 40px auto; padding: 25px; background: #1e293b; border-radius: 10px; color: white; font-family: sans-serif;">
    <h2>System Admin: Register New Shop</h2>
    <form id="createShopForm">
        <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px;">Admin Secret Key</label>
            <input type="password" id="adminKey" required style="width: 100%; padding: 8px; border-radius: 5px; border: 1px solid #475569; background: #0f172a; color: white;">
        </div>
        <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px;">Shop ID (Number)</label>
            <input type="number" id="shopId" placeholder="e.g. 6" style="width: 100%; padding: 8px; border-radius: 5px; border: 1px solid #475569; background: #0f172a; color: white;">
        </div>
        <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px;">Shop Name</label>
            <input type="text" id="shopName" required style="width: 100%; padding: 8px; border-radius: 5px; border: 1px solid #475569; background: #0f172a; color: white;">
        </div>
        <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px;">Manager Fullname </label>
            <input type="text" id="managerName" placeholder="e.g. John Doe" style="width: 100%; padding: 8px; border-radius: 5px; border: 1px solid #475569; background: #0f172a; color: white;">
        </div>
        <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px;">Authorized Email</label>
            <input type="email" id="authorizedEmail" required style="width: 100%; padding: 8px; border-radius: 5px; border: 1px solid #475569; background: #0f172a; color: white;">
        </div>
        <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px;">Contact Phone</label>
            <input type="text" id="contactPhone" style="width: 100%; padding: 8px; border-radius: 5px; border: 1px solid #475569; background: #0f172a; color: white;">
        </div>
        <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px;">City</label>
            <input type="text" id="city" style="width: 100%; padding: 8px; border-radius: 5px; border: 1px solid #475569; background: #0f172a; color: white;">
        </div>
        <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px;">Sub-location</label>
            <input type="text" id="sublocation" style="width: 100%; padding: 8px; border-radius: 5px; border: 1px solid #475569; background: #0f172a; color: white;">
        </div>
        <div style="margin-bottom: 20px;">
            <label style="display: block; margin-bottom: 5px;">Initial Security PIN</label>
            <input type="text" id="initialPin" value="1234" required style="width: 100%; padding: 8px; border-radius: 5px; border: 1px solid #475569; background: #0f172a; color: white;">
        </div>
        <button type="submit" style="width: 100%; padding: 10px; background: #10b981; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer;">Register Shop</button>
    </form>
    <p id="adminResponseMsg" style="margin-top: 15px; font-weight: bold; text-align: center;"></p>
</div>

<script>
document.getElementById('createShopForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msgEl = document.getElementById('adminResponseMsg');
    msgEl.style.color = '#cbd5e1';
    msgEl.innerText = 'Registering shop...';

    const payload = {
        adminKey: document.getElementById('adminKey').value,
        shopId: document.getElementById('shopId').value,
        shopName: document.getElementById('shopName').value,
        managerName: document.getElementById('managerName').value,
        authorizedEmail: document.getElementById('authorizedEmail').value,
        contactPhone: document.getElementById('contactPhone').value,
        city: document.getElementById('city').value,
        sublocation: document.getElementById('sublocation').value,
        initialPin: document.getElementById('initialPin').value
    };

    try {
        const response = await fetch('https://price-check-webhook.onrender.com/api/admin/create-shop', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        const data = await response.json();

        if (data.success) {
            msgEl.style.color = '#34d399';
            msgEl.innerText = 'Shop registered successfully!';
            document.getElementById('createShopForm').reset();
            document.getElementById('initialPin').value = '1234';
        } else {
            msgEl.style.color = '#f87171';
            msgEl.innerText = 'Error: ' + data.message;
        }
    } catch (err) {
        msgEl.style.color = '#f87171';
        msgEl.innerText = 'Network error connecting to backend server.';
    }
});
</script>   
</body>
</html>
