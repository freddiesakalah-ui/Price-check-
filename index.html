<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PriceCheck MVP - PIN Reset & Recovery Console</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [activeTab, setActiveTab] = useState('manager');
            const [managerStep, setManagerStep] = useState(1);
            const [email, setEmail] = useState('');
            const [otp, setOtp] = useState('');
            const [newPin, setNewPin] = useState('');
            const [confirmPin, setConfirmPin] = useState('');
            const [loading, setLoading] = useState(false);
            const [message, setMessage] = useState(null);

            // Admin State
            const [shops, setShops] = useState([
                { id: 1, name: 'OK Zimbabwe', email: 'manager.ok@grocery.co.zw', city: 'Harare', sub: 'CBD', status: 'Active', pin: '4821' },
                { id: 2, name: 'TM Pick n Pay', email: 'manager.tmpnp@grocery.co.zw', city: 'Harare', sub: 'Avondale', status: 'Active', pin: '9012' },
                { id: 3, name: 'Food World', email: 'manager.fw@grocery.co.zw', city: 'Bulawayo', sub: 'Belmont', status: 'Compromised', pin: '1102' },
                { id: 5, name: 'Test Grocery Store', email: 'fredrick.sakala@outlook.com', city: 'Harare', sub: 'Kuwadzana', status: 'Active', pin: '1664' }
            ]);
            const [filterStatus, setFilterStatus] = useState('All');
            const [auditLogs, setAuditLogs] = useState([
                { time: '12:15 PM', event: 'Shop #5 Onboarded & PIN Generated (Mailgun Sent)', type: 'success' },
                { time: '11:30 AM', event: 'Shop #3 Flagged as Compromised by Admin', type: 'warning' }
            ]);

            useEffect(() => {
                lucide.createIcons();
            }, [managerStep, activeTab, shops]);

            const handleRequestOtp = (e) => {
                e.preventDefault();
                setLoading(true);
                setTimeout(() => {
                    setLoading(false);
                    setManagerStep(2);
                    setMessage({ type: 'success', text: '6-digit OTP verification code sent via Mailgun!' });
                }, 1000);
            };

            const handleVerifyOtp = (e) => {
                e.preventDefault();
                setLoading(true);
                setTimeout(() => {
                    setLoading(false);
                    setManagerStep(3);
                    setMessage(null);
                }, 800);
            };

            const handleUpdatePin = (e) => {
                e.preventDefault();
                if (newPin !== confirmPin || newPin.length !== 4) {
                    setMessage({ type: 'error', text: 'PINs must match and be exactly 4 digits.' });
                    return;
                }
                setLoading(true);
                setTimeout(() => {
                    setLoading(false);
                    setManagerStep(4);
                    setAuditLogs(prev => [{ time: new Date().toLocaleTimeString(), event: `Manager PIN successfully reset for ${email}`, type: 'success' }, ...prev]);
                }, 1000);
            };

            const toggleShopStatus = (id) => {
                setShops(shops.map(shop => {
                    if (shop.id === id) {
                        const newStatus = shop.status === 'Active' ? 'Compromised' : 'Active';
                        setAuditLogs(prev => [{ time: new Date().toLocaleTimeString(), event: `Shop #${id} (${shop.name}) status changed to ${newStatus}`, type: newStatus === 'Compromised' ? 'danger' : 'success' }, ...prev]);
                        return { ...shop, status: newStatus };
                    }
                    return shop;
                }));
            };

            const triggerMailgunReset = (shop) => {
                alert(`[Mailgun API] Magic reset link & temporary PIN dispatched to ${shop.email}`);
                setAuditLogs(prev => [{ time: new Date().toLocaleTimeString(), event: `Mailgun reset link sent to ${shop.name} (${shop.email})`, type: 'success' }, ...prev]);
            };

            return (
                <div className="max-w-6xl mx-auto p-4 sm:p-6 lg:p-8">
                    {/* Header */}
                    <header className="flex flex-col sm:flex-row justify-between items-center bg-slate-800 border border-slate-700 rounded-2xl p-6 mb-8 shadow-xl">
                        <div>
                            <div className="flex items-center gap-3 mb-2">
                                <div className="bg-emerald-500/10 border border-emerald-500/30 p-2 rounded-xl text-emerald-400">
                                    <i data-lucide="shield-check" className="w-8 h-8"></i>
                                </div>
                                <h1 className="text-2xl font-bold text-white tracking-tight">PriceCheck MVP Security Console</h1>
                            </div>
                            <p className="text-slate-400 text-sm">Automated Store Onboarding, PIN Recovery & Credential Management System</p>
                        </div>
                        <div className="mt-4 sm:mt-0 flex bg-slate-900 p-1.5 rounded-xl border border-slate-700">
                            <button 
                                onClick={() => setActiveTab('manager')}
                                className={`flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium transition-all ${activeTab === 'manager' ? 'bg-emerald-600 text-white shadow-lg' : 'text-slate-400 hover:text-white'}`}>
                                <i data-lucide="user-cog" className="w-4 h-4"></i> Store Manager Portal
                            </button>
                            <button 
                                onClick={() => setActiveTab('admin')}
                                className={`flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium transition-all ${activeTab === 'admin' ? 'bg-emerald-600 text-white shadow-lg' : 'text-slate-400 hover:text-white'}`}>
                                <i data-lucide="shield-alert" className="w-4 h-4"></i> Admin Console
                            </button>
                        </div>
                    </header>

                    {/* Notification Banner */}
                    {message && (
                        <div className={`mb-6 p-4 rounded-xl border flex items-center gap-3 ${message.type === 'success' ? 'bg-emerald-950/40 border-emerald-500/30 text-emerald-300' : 'bg-rose-950/40 border-rose-500/30 text-rose-300'}`}>
                            <i data-lucide={message.type === 'success' ? 'check-circle-2' : 'alert-circle'} className="w-5 h-5 flex-shrink-0"></i>
                            <span className="text-sm">{message.text}</span>
                        </div>
                    )}

                    {/* MAIN CONTENT AREA */}
                    {activeTab === 'manager' ? (
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                            {/* Wizard Form */}
                            <div className="lg:col-span-2 bg-slate-800 border border-slate-700 rounded-2xl p-6 sm:p-8 shadow-xl">
                                <div className="flex items-center justify-between pb-6 mb-6 border-b border-slate-700">
                                    <div>
                                        <h2 className="text-xl font-semibold text-white">Store Manager PIN Recovery</h2>
                                        <p className="text-sm text-slate-400">Self-service secure workflow for forgotten or compromised credentials.</p>
                                    </div>
                                    <span className="text-xs font-semibold px-3 py-1 rounded-full bg-slate-700 text-slate-300">Step {managerStep} of 4</span>
                                </div>

                                {managerStep === 1 && (
                                    <form onSubmit={handleRequestOtp} className="space-y-4">
                                        <div>
                                            <label className="block text-sm font-medium text-slate-300 mb-2">Authorized Manager Email</label>
                                            <div className="relative">
                                                <i data-lucide="mail" className="absolute left-3.5 top-3.5 w-5 h-5 text-slate-500"></i>
                                                <input 
                                                    type="email" 
                                                    required
                                                    value={email}
                                                    onChange={(e) => setEmail(e.target.value)}
                                                    placeholder="manager@grocery.co.zw" 
                                                    className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 pl-12 text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500"
                                                />
                                            </div>
                                            <p className="text-xs text-slate-500 mt-2">Enter the email registered during store onboarding.</p>
                                        </div>
                                        <button type="submit" disabled={loading} className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-3 rounded-xl transition flex items-center justify-center gap-2">
                                            {loading ? <i data-lucide="loader-2" className="w-5 h-5 animate-spin"></i> : <>Send Verification OTP <i data-lucide="arrow-right" className="w-4 h-4"></i></>}
                                        </button>
                                    </form>
                                )}

                                {managerStep === 2 && (
                                    <form onSubmit={handleVerifyOtp} className="space-y-4">
                                        <div>
                                            <label className="block text-sm font-medium text-slate-300 mb-2">Enter 6-Digit Mailgun OTP</label>
                                            <input 
                                                type="text" 
                                                maxLength="6"
                                                required
                                                value={otp}
                                                onChange={(e) => setOtp(e.target.value)}
                                                placeholder="123456" 
                                                className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-center tracking-widest text-2xl text-white placeholder-slate-700 focus:outline-none focus:border-emerald-500"
                                            />
                                            <p className="text-xs text-slate-500 mt-2">Check your inbox ({email}) for the temporary verification token.</p>
                                        </div>
                                        <div className="flex gap-3">
                                            <button type="button" onClick={() => setManagerStep(1)} className="w-1/3 bg-slate-700 hover:bg-slate-600 text-white font-medium py-3 rounded-xl transition">Back</button>
                                            <button type="submit" disabled={loading} className="w-2/3 bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-3 rounded-xl transition flex items-center justify-center gap-2">
                                                {loading ? <i data-lucide="loader-2" className="w-5 h-5 animate-spin"></i> : 'Verify Code'}
                                            </button>
                                        </div>
                                    </form>
                                )}

                                {managerStep === 3 && (
                                    <form onSubmit={handleUpdatePin} className="space-y-4">
                                        <div>
                                            <label className="block text-sm font-medium text-slate-300 mb-2">New 4-Digit Security PIN</label>
                                            <input 
                                                type="password" 
                                                maxLength="4"
                                                required
                                                value={newPin}
                                                onChange={(e) => setNewPin(e.target.value)}
                                                placeholder="••••" 
                                                className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-center tracking-widest text-xl text-white placeholder-slate-700 focus:outline-none focus:border-emerald-500"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-slate-300 mb-2">Confirm New PIN</label>
                                            <input 
                                                type="password" 
                                                maxLength="4"
                                                required
                                                value={confirmPin}
                                                onChange={(e) => setConfirmPin(e.target.value)}
                                                placeholder="••••" 
                                                className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-center tracking-widest text-xl text-white placeholder-slate-700 focus:outline-none focus:border-emerald-500"
                                            />
                                        </div>
                                        <button type="submit" disabled={loading} className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-3 rounded-xl transition flex items-center justify-center gap-2">
                                            {loading ? <i data-lucide="loader-2" className="w-5 h-5 animate-spin"></i> : 'Update Security PIN'}
                                        </button>
                                    </form>
                                )}

                                {managerStep === 4 && (
                                    <div className="text-center py-6 space-y-4">
                                        <div className="w-16 h-16 bg-emerald-500/20 border border-emerald-500/40 rounded-full flex items-center justify-center mx-auto text-emerald-400">
                                            <i data-lucide="check" className="w-8 h-8"></i>
                                        </div>
                                        <h3 className="text-xl font-bold text-white">PIN Reset Successful!</h3>
                                        <p className="text-slate-400 text-sm max-w-md mx-auto">Your store's security credentials have been updated in Airtable. You can now use your new 4-digit PIN for all API price submissions.</p>
                                        <button onClick={() => { setManagerStep(1); setEmail(''); setOtp(''); setNewPin(''); setConfirmPin(''); }} className="bg-slate-700 hover:bg-slate-600 text-white px-6 py-2.5 rounded-xl text-sm font-medium transition">
                                            Reset Another Store
                                        </button>
                                    </div>
                                )}
                            </div>

                            {/* Sidebar Info */}
                            <div className="space-y-6">
                                <div className="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl">
                                    <h3 className="text-base font-semibold text-white mb-3 flex items-center gap-2">
                                        <i data-lucide="info" className="w-5 h-5 text-emerald-400"></i> Security Protocol
                                    </h3>
                                    <ul className="space-y-3 text-sm text-slate-400">
                                        <li className="flex items-start gap-2">
                                            <i data-lucide="check-circle-2" className="w-4 h-4 text-emerald-400 mt-0.5 flex-shrink-0"></i>
                                            <span><strong>Mailgun Verification:</strong> OTPs expire in 15 minutes for maximum account security.</span>
                                        </li>
                                        <li className="flex items-start gap-2">
                                            <i data-lucide="check-circle-2" className="w-4 h-4 text-emerald-400 mt-0.5 flex-shrink-0"></i>
                                            <span><strong>Airtable Sync:</strong> PIN updates are instantly committed to your active shop records.</span>
                                        </li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    ) : (
                        /* ADMIN CONSOLE VIEW */
                        <div className="space-y-8">
                            <div className="bg-slate-800 border border-slate-700 rounded-2xl p-6 sm:p-8 shadow-xl">
                                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
                                    <div>
                                        <h2 className="text-xl font-semibold text-white">Store Security & Credential Registry</h2>
                                        <p className="text-sm text-slate-400">Monitor active shop statuses, flag compromised PINs, and trigger forced resets.</p>
                                    </div>
                                    <div className="flex gap-2">
                                        {['All', 'Active', 'Compromised'].map(status => (
                                            <button 
                                                key={status}
                                                onClick={() => setFilterStatus(status)}
                                                className={`px-3 py-1.5 rounded-lg text-xs font-medium transition ${filterStatus === status ? 'bg-emerald-600 text-white' : 'bg-slate-700 text-slate-300 hover:bg-slate-600'}`}>
                                                {status}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div className="overflow-x-auto">
                                    <table className="w-full text-left border-collapse">
                                        <thead>
                                            <tr className="border-b border-slate-700 text-xs text-slate-400 uppercase tracking-wider">
                                                <th className="py-3 px-4">Shop ID & Name</th>
                                                <th className="py-3 px-4">Manager Email</th>
                                                <th className="py-3 px-4">Location</th>
                                                <th className="py-3 px-4">Status</th>
                                                <th className="py-3 px-4">Current PIN</th>
                                                <th className="py-3 px-4 text-right">Actions</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-700 text-sm">
                                            {shops.filter(s => filterStatus === 'All' || s.status === filterStatus).map(shop => (
                                                <tr key={shop.id} className="hover:bg-slate-750/50 transition">
                                                    <td className="py-4 px-4 font-medium text-white">#{shop.id} - {shop.name}</td>
                                                    <td className="py-4 px-4 text-slate-300">{shop.email}</td>
                                                    <td className="py-4 px-4 text-slate-400">{shop.city}, {shop.sub}</td>
                                                    <td className="py-4 px-4">
                                                        <span className={`inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold ${shop.status === 'Active' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/30' : 'bg-rose-500/10 text-rose-400 border border-rose-500/30'}`}>
                                                            <span className={`w-1.5 h-1.5 rounded-full ${shop.status === 'Active' ? 'bg-emerald-400' : 'bg-rose-400'}`}></span>
                                                            {shop.status}
                                                        </span>
                                                    </td>
                                                    <td className="py-4 px-4 font-mono text-emerald-400">{shop.pin}</td>
                                                    <td className="py-4 px-4 text-right space-x-2">
                                                        <button 
                                                            onClick={() => triggerMailgunReset(shop)}
                                                            title="Send Mailgun Reset Link"
                                                            className="p-2 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-lg transition">
                                                            <i data-lucide="mail" className="w-4 h-4"></i>
                                                        </button>
                                                        <button 
                                                            onClick={() => toggleShopStatus(shop.id)}
                                                            className={`px-3 py-1.5 rounded-lg text-xs font-medium transition ${shop.status === 'Active' ? 'bg-rose-600/20 text-rose-300 hover:bg-rose-600/30 border border-rose-500/30' : 'bg-emerald-600/20 text-emerald-300 hover:bg-emerald-600/30 border border-emerald-500/30'}`}>
                                                            {shop.status === 'Active' ? 'Flag Compromised' : 'Restore Active'}
                                                        </button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>

                            {/* Audit Log Feed */}
                            <div className="bg-slate-800 border border-slate-700 rounded-2xl p-6 sm:p-8 shadow-xl">
                                <h3 className="text-base font-semibold text-white mb-4 flex items-center gap-2">
                                    <i data-lucide="activity" className="w-5 h-5 text-emerald-400"></i> Live Security Audit Feed
                                </h3>
                                <div className="space-y-3">
                                    {auditLogs.map((log, index) => (
                                        <div key={index} className="flex items-center justify-between p-3 bg-slate-900 border border-slate-700/60 rounded-xl text-sm">
                                            <div className="flex items-center gap-3">
                                                <div className={`w-2 h-2 rounded-full ${log.type === 'danger' ? 'bg-rose-500' : 'bg-emerald-500'}`}></div>
                                                <span className="text-slate-200">{log.event}</span>
                                            </div>
                                            <span className="text-xs text-slate-500 font-mono">{log.time}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
